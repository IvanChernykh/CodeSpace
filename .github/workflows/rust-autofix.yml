name: Product finalize

on:
  pull_request:
    branches: [main]
    paths:
      - '.autofix-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard toolchain
        working-directory: dashboard
        run: npm ci
      - name: Make site patch whitespace-tolerant and apply product polish
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize_product.py')
          content = path.read_text(encoding='utf-8')
          old = '''    for old, new in replacements:
                  replace_once(path, old, new)
          '''
          new = '''    content = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  content = content.replace(old, new)
              content = content.replace(
                  '# Index and retrieve</span>\\ncse init\\ncse context --query',
                  '# Index, open the control plane, and retrieve</span>\\ncse init\\ncse dashboard\\ncse context --query',
              )
              path.write_text(content, encoding="utf-8")
              required = ["12 MCP tools", "Local dashboard", "cse dashboard", "complete local control plane"]
              missing = [item for item in required if item not in content]
              if missing:
                  raise SystemExit(f"site postconditions failed: {missing}")
          '''
          if old not in content:
              raise SystemExit('could not locate strict site replacement loop')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          set +e
          python3 scripts/finalize_product.py > artifacts/finalize.log 2>&1
          status=$?
          cat artifacts/finalize.log
          echo "$status" > artifacts/finalize.status
          exit "$status"
      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-finalizer-diagnostics
          path: artifacts/
          if-no-files-found: warn
      - name: Build dashboard assets
        working-directory: dashboard
        run: npm run build
      - name: Validate dashboard and public site
        run: |
          python3 scripts/validate_dashboard_contract.py
          python3 scripts/validate_pages.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format and validate product source
        run: |
          cargo +1.97.1 fmt --all
          cargo +1.97.1 check --all-targets --locked
          cargo +1.97.1 test --all-targets --locked
          cargo +1.97.1 clippy --all-targets --all-features --locked -- -D warnings
      - name: Commit finalized product
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No product changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish dashboard UX and public product surface"
          git push origin "HEAD:${HEAD_REF}"
