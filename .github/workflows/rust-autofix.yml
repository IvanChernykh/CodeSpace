name: Rust autofix

on:
  pull_request:
    branches: [main]
    paths:
      - '.autofix-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Apply final self-test contract fixes and deterministic Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_final_self_test_contract.py
          rm scripts/patch_final_self_test_contract.py .autofix-trigger
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fix --all-targets --allow-dirty --allow-staged --locked || true
          cargo +1.97.1 clippy --fix --all-targets --allow-dirty --allow-staged --locked -- -W clippy::correctness || true
          cargo +1.97.1 fmt --all
      - name: Validate resulting source and behavioral harness
        run: |
          cargo +1.97.1 check --all-targets --locked
          cargo +1.97.1 test --all-targets --locked
          cargo +1.97.1 clippy --all-targets --all-features --locked -- -D warnings
          python3 scripts/self_test.py
          git restore --worktree --staged artifacts 2>/dev/null || true
      - name: Commit validated fixes to pull-request branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align static contracts with verified runtime"
          git push origin "HEAD:${HEAD_REF}"
