name: Rust autofix

on:
  pull_request:
    branches: [main]
    paths:
      - '.autofix-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Persist compact self-test diagnosis
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_self_test_v2.py
          if python3 scripts/self_test.py > /tmp/self-test.log 2>&1; then
            printf 'self-test unexpectedly passed during diagnosis\n' > .self-test-failure.log
          else
            {
              echo '=== SELF-TEST FAILURE SUMMARY ==='
              grep -n '\[FAIL\]' /tmp/self-test.log || true
              echo '=== SELF-TEST FAILURE TAIL ==='
              tail -n 80 /tmp/self-test.log
            } > .self-test-failure.log
          fi
          rm -f .autofix-trigger
          git restore --worktree --staged artifacts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .self-test-failure.log .autofix-trigger
          git commit -m "ci: persist compact CodeSpace self-test diagnosis"
          git push origin "HEAD:${HEAD_REF}"
