name: Monochrome workbench finalize

on:
  pull_request:
    branches: [main]
    paths:
      - '.autofix-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard toolchain
        working-directory: dashboard
        run: npm ci
      - name: Apply monochrome IDE workbench
        run: python3 scripts/apply_monochrome_workbench.py
      - name: Build and validate dashboard
        run: |
          cd dashboard
          npm run build
          node --check dist/main.js
          cd ..
          node --check scripts/render_dashboard.mjs
          python3 scripts/validate_dashboard_contract.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Validate product
        run: |
          cargo +1.97.1 fmt --all
          cargo +1.97.1 check --all-targets --locked
          cargo +1.97.1 test --all-targets --locked
          cargo +1.97.1 clippy --all-targets --all-features --locked -- -D warnings
      - name: Commit workbench redesign
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard.rs dashboard/src/main.ts dashboard/dist/main.js dashboard/dist/dashboard.css scripts/render_dashboard.mjs .github/workflows/ci.yml
          git diff --cached --stat
          git commit -m "Redesign dashboard as a monochrome IDE workbench"
          git push origin "HEAD:${HEAD_REF}"
