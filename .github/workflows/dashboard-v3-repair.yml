name: CodeSpace v3 repair

on:
  push:
    branches:
      - fix/dashboard-v3-stability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          show-progress: false

      - name: Restore verified payload
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -ex
            cat .repair/v3/chunk-* > /tmp/payload.b64
            base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
            sha256sum /tmp/payload.tar.gz
            echo "9145789e504649860b5165003e860d913ec19969b9a62073150d8733fec7239b  /tmp/payload.tar.gz" | sha256sum --check -
            tar -xzf /tmp/payload.tar.gz
            python .repair/v3/pre_apply.py
            python scripts/apply_v3_repair.py
            python .repair/v3/post_apply.py
            rm -rf .repair/v3 scripts/apply_v3_repair.py
          } 2>&1 | tee /tmp/repair.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p .repair/v3
            cp /tmp/repair.log .repair/v3/last-error.log
            exit "$status"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build frontend
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          node --check dist/main.js

      - name: Validate dashboard contracts
        run: python scripts/validate_dashboard_contract.py

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.0

      - name: Rust quality
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -ex
            cargo fmt --all
            cargo check --locked
            cargo test --locked --all-targets
            cargo clippy --locked --all-targets --all-features -- -D warnings
          } 2>&1 | tee /tmp/rust-quality.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p .repair/v3
            cp /tmp/rust-quality.log .repair/v3/rust-error.log
            exit "$status"
          fi

      - name: Commit repaired build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: rebuild CodeSpace dashboard and local control plane [v3-generated]"
          git push origin HEAD:fix/dashboard-v3-stability
