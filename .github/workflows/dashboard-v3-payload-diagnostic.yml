name: CodeSpace v3 payload diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Print exact payload checksums
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init --quiet
          git fetch --quiet --depth 1 https://github.com/IvanChernykh/CodeSpace.git "$PR_HEAD_SHA"
          git checkout --quiet FETCH_HEAD
          sha256sum \
            .repair/v3/chunk-00 .repair/v3/chunk-01 .repair/v3/chunk-02 .repair/v3/chunk-03 \
            .repair/v3/chunk-04a .repair/v3/chunk-04b \
            .repair/v3/chunk-05a .repair/v3/chunk-05b \
            .repair/v3/chunk-06a .repair/v3/chunk-06b \
            .repair/v3/chunk-07a .repair/v3/chunk-07b \
            .repair/v3/chunk-08a .repair/v3/chunk-08b
          cat \
            .repair/v3/chunk-00 .repair/v3/chunk-01 .repair/v3/chunk-02 .repair/v3/chunk-03 \
            .repair/v3/chunk-04a .repair/v3/chunk-04b \
            .repair/v3/chunk-05a .repair/v3/chunk-05b \
            .repair/v3/chunk-06a .repair/v3/chunk-06b \
            .repair/v3/chunk-07a .repair/v3/chunk-07b \
            .repair/v3/chunk-08a .repair/v3/chunk-08b > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          sha256sum /tmp/payload.tar.gz
