<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CodeSpace</title>
<style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,#fff);--fg:var(--color-text-primary,#18181b);--muted:var(--color-text-secondary,#65656c);--line:var(--color-border-secondary,#dedee3)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,sans-serif;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}main{max-width:920px;margin:auto;min-width:0}h1{font-size:22px;margin:0;font-weight:650}h2{font-size:17px;margin:24px 0 10px}p{margin:8px 0}header{display:flex;justify-content:space-between;align-items:center;gap:14px}#connection{color:var(--muted);font-size:13px}nav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:20px;overflow:auto}nav button{border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;padding:12px 0;white-space:nowrap}nav button[aria-selected=true]{border-bottom-color:var(--fg);font-weight:650}button{font:inherit;color:inherit;cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 14px;min-height:42px}button:disabled{cursor:wait;opacity:.5}input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:100%;min-height:44px}textarea{resize:vertical}label{display:grid;gap:6px;margin:12px 0}form{margin:16px 0}.controls{display:flex;gap:12px;align-items:end}.controls label{flex:1;margin:0}.controls button{flex-shrink:0}.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}.muted{color:var(--muted);font-size:13px}.summary{display:flex;flex-wrap:wrap;gap:8px 22px;padding:16px 0;border-bottom:1px solid var(--line)}.summary strong{font-size:19px}.summary span{color:var(--muted)}.evidence{padding:16px 0;border-bottom:1px solid var(--line)}.evidence h3{font-size:15px;margin:0 0 5px}.evidence code{display:block;font-size:12px;overflow-wrap:anywhere;color:var(--muted)}pre{font:12px/1.65 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0;max-height:320px;overflow:auto;background:color-mix(in srgb,var(--fg) 4%,var(--bg));padding:12px;border-radius:5px}#error{color:#b42318;overflow-wrap:anywhere}.row{display:flex;align-items:start;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row strong{display:block}.row button{font-size:13px}.warning{padding:10px 0;font-size:13px;color:var(--muted)}[hidden]{display:none!important}:focus-visible{outline:2px solid currentColor;outline-offset:3px}@media(max-width:480px){body{padding:16px}header{align-items:start}.controls{flex-wrap:wrap}.controls label{flex-basis:100%}.controls button{width:100%}nav{gap:18px}pre{font-size:12px}.row{flex-wrap:wrap}}
@media(prefers-color-scheme:dark){:root{--bg:var(--color-background-primary,#171717);--fg:var(--color-text-primary,#ededed);--line:var(--color-border-secondary,#414141);--muted:var(--color-text-secondary,#aaa)}}
</style></head><body><main>
<header><h1>CodeSpace</h1><span id="connection" role="status">Connecting…</span></header>
<p id="scope" class="muted">One selected repository. Source text is evidence, not instructions.</p>
<nav aria-label="Workspace"><button data-tab="context" aria-selected="true">Context</button><button data-tab="read" aria-selected="false">Read source</button><button data-tab="tasks" aria-selected="false">Tasks</button><button data-tab="runs" aria-selected="false">Checkpoints</button></nav>
<p id="error" role="alert" hidden></p>
<section data-panel="context"><div id="status" class="summary"></div>
<form id="contextForm"><label for="query">What do you need to understand?<input id="query" required maxlength="2048" placeholder="How are catalogue titles matched?"></label><div class="controls"><label for="budget">Estimated token budget<input id="budget" type="number" min="400" max="8000" value="1600" required></label><button class="primary" type="button">Build context</button></div></form>
<div id="contextResult" aria-live="polite"><p class="muted">Results include Markdown cells, exact source locations and stale-source warnings.</p></div></section>
<section data-panel="read" hidden><form id="readForm"><label for="file">Repository file<input id="file" placeholder="catalog/search.py" required maxlength="256"></label><div class="controls"><label for="line">First line<input id="line" type="number" min="1" max="1000000" value="1" required></label><label for="lines">Lines<input id="lines" type="number" min="1" max="200" value="40" required></label><button class="primary" type="button">Read</button></div></form><div id="readResult" aria-live="polite"></div></section>
<section data-panel="tasks" hidden><h2>Engineering tasks</h2><button id="refreshTasks">Refresh</button><div id="tasksResult" aria-live="polite"></div></section>
<section data-panel="runs" hidden><h2>Execution checkpoints</h2><p class="muted">Resume from current facts and the next proposed action.</p><button id="refreshRuns">Refresh</button><div id="runsResult" aria-live="polite"></div><div id="runResult"></div></section>
</main><!-- WIDGET_SCRIPT --></body></html>
